name: KNABA DE release verification
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: knaba-verification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_DB: knaba_qa
          POSTGRES_USER: knaba_test
          POSTGRES_PASSWORD: synthetic-ci-only
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd "pg_isready -U knaba_test -d knaba_qa"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      APP_MODE: TEST
      COMPANY_ID: knaba-demo
      GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      EXPECTED_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      KNABA_QA_ADMIN_URL: postgresql://knaba_test:synthetic-ci-only@127.0.0.1:5432/postgres
      KNABA_PG_TRANSPORT: container
      PLAYWRIGHT_CHROMIUM_EXECUTABLE: ''
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --strict-ssl=true
      - run: python3 -m pip install openpyxl==3.1.5 Pillow==11.3.0
      - run: npm run typecheck
      - run: npm run build
      - name: Attest exact built application artifacts
        run: |
          node --input-type=module <<'JS'
          import {readFile,readdir,writeFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          const release=JSON.parse(await readFile('dist/release.json','utf8'));
          const actual=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          if(release.code_sha!==actual||actual!==process.env.EXPECTED_GIT_SHA||release.source_dirty)throw Error('EXACT_CLEAN_ARTIFACT_SOURCE_REQUIRED');
          const files=[];
          async function scan(path){for(const entry of await readdir(path,{withFileTypes:true})){const file=path+'/'+entry.name;if(entry.isDirectory())await scan(file);else{const bytes=await readFile(file);files.push({path:file,bytes:bytes.length,sha256:createHash('sha256').update(bytes).digest('hex')});}}}
          await scan('dist');
          for(const path of ['package.json','package-lock.json']){const bytes=await readFile(path);files.push({path,bytes:bytes.length,sha256:createHash('sha256').update(bytes).digest('hex')});}
          files.sort((a,b)=>a.path.localeCompare(b.path));
          const tree=execFileSync('git',['rev-parse','HEAD^{tree}'],{encoding:'utf8'}).trim();
          await writeFile('docs/evidence/built-artifacts.json',JSON.stringify({status:'PASSED',code_sha:actual,source_tree:tree,node:process.version,files,scope:'Actual built API, worker, web and pinned installation manifests; production dependencies must be installed with npm ci before standalone execution.'},null,2)+'\n');
          console.log('Exact clean source and actual built artifact checksums attested:',actual,files.length);
          JS
      - name: Validate release scripts
        run: |
          bash -n infra/backup.sh infra/restore.sh infra/doctor.sh infra/verify.sh scripts/bootstrap-local.sh
          for script in scripts/*.mjs; do node --check "$script"; done
      - run: npx playwright install --with-deps chromium
      - name: Real isolated SQL browser restore and worker restart acceptance
        env:
          KNABA_PG_CONTAINER: ${{ job.services.postgres.id }}
        run: bash scripts/live-isolated-check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: knaba-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            docs/evidence/
            dist/
            package.json
            package-lock.json
            /tmp/knaba-de-test-artifacts/
          retention-days: 7
