name: KNABA DE release verification
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: knaba-verification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_DB: knaba_qa
          POSTGRES_USER: knaba_test
          POSTGRES_PASSWORD: synthetic-ci-only
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd "pg_isready -U knaba_test -d knaba_qa"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      APP_MODE: TEST
      COMPANY_ID: knaba-demo
      GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      EXPECTED_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      KNABA_QA_ADMIN_URL: postgresql://knaba_test:synthetic-ci-only@127.0.0.1:5432/postgres
      KNABA_PG_TRANSPORT: container
      PLAYWRIGHT_CHROMIUM_EXECUTABLE: ''
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --strict-ssl=true
      - run: python3 -m pip install openpyxl==3.1.5 Pillow==11.3.0
      - run: npm run typecheck
      - run: npm run build
      - name: Validate release scripts
        run: |
          bash -n infra/backup.sh infra/restore.sh infra/doctor.sh infra/verify.sh scripts/bootstrap-local.sh
          for script in scripts/*.mjs; do node --check "$script"; done
      - run: npx playwright install --with-deps chromium
      - name: Real isolated SQL browser restore and worker restart acceptance
        env:
          KNABA_PG_CONTAINER: ${{ job.services.postgres.id }}
        run: bash scripts/live-isolated-check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: knaba-evidence-${{ github.sha }}
          path: |
            docs/evidence/
            dist/release.json
            /tmp/knaba-de-test-artifacts/
          retention-days: 7
