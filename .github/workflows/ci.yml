name: KNABA repository verification

on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: knaba-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

defaults:
  run:
    shell: bash

jobs:
  root:
    name: Source integrity and policy tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - run: npm run audit:source
      - run: npm run verify:modules
      - run: npm test

      - name: Verify isolated deployment and schema rollback boundaries
        run: python3 -m unittest discover -s corporate-site/vps/customer-environments -p test_knabactl.py
      - name: Verify source and server package boundaries
        run: python3 -m unittest discover -s scripts -p test_package_server_candidate.py -v

  site:
    name: Corporate site checks and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: corporate-site
    env:
      KNABA_RELEASE_MODE: official
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - run: npm ci --ignore-scripts --strict-ssl=true --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run verify:build
      - run: npm run test:vps

  erp:
    name: ERP checks, build and PostgreSQL tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: erp
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_DB: knaba_ci
          POSTGRES_USER: knaba_test
          POSTGRES_PASSWORD: synthetic-ci-only
        ports:
          - '127.0.0.1:5432:5432'
        options: >-
          --health-cmd "pg_isready -U knaba_test -d knaba_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      APP_MODE: TEST
      COMPANY_ID: knaba-demo
      DATABASE_URL: postgresql://knaba_test:synthetic-ci-only@127.0.0.1:5432/knaba_ci
      GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --strict-ssl=true --no-audit --no-fund
      - name: Install independent document readers
        run: |
          python3 -m pip install --disable-pip-version-check openpyxl==3.1.5 Pillow==11.3.0
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils
          pdftotext -v
      - name: Build shared intake adapter for PostgreSQL regression tests
        # The four preserved adapter-level SQL cases use the same core as the
        # actual HTTP bridge job. No second dispatcher or site framework build.
        run: node_modules/.bin/esbuild ../corporate-site/vps/erp-intake-entry.ts --bundle --platform=node --target=node24 --format=esm --minify --outfile=../corporate-site/dist/vps/erp-intake.mjs
      - run: node scripts/database-check.mjs
      - run: npm run migrate
      - run: npm run typecheck
      - run: npm run build
      - name: Check built source identity
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const release=JSON.parse(readFileSync('dist/release.json','utf8'));
          const actual=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          if(actual!==process.env.SOURCE_SHA || release.code_sha!==actual || release.source_dirty!==false || release.source_provenance!=='GIT_WORKTREE') {
            throw new Error('EXACT_CLEAN_BUILD_SOURCE_REQUIRED');
          }
          console.log('Build source verified:',actual);
          JS
      - name: Run CPU and real PostgreSQL tests
        # Each SQL file reapplies DDL to the same database in beforeAll.
        # Serialize files; explicit concurrent transactions inside tests still run.
        run: npm test -- --no-file-parallelism --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/erp-vitest.json"
      - name: Reject skipped or incomplete ERP tests
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          const report=JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/erp-vitest.json`,'utf8'));
          if(report.success!==true || report.numTotalTests<1 || report.numPassedTests!==report.numTotalTests || report.numFailedTests!==0 || report.numPendingTests!==0 || report.numTodoTests!==0) {
            throw new Error('ALL_DISCOVERED_ERP_TESTS_MUST_PASS_WITHOUT_SKIPS');
          }
          console.log('Passed ERP assertions:',report.numPassedTests);
          JS

  bridge:
    name: Site SQLite to ERP PostgreSQL HTTP acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_DB: knaba_bridge_ci
          POSTGRES_USER: knaba_test
          POSTGRES_PASSWORD: synthetic-ci-only
        ports:
          - '127.0.0.1:5432:5432'
        options: >-
          --health-cmd "pg_isready -U knaba_test -d knaba_bridge_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      APP_MODE: TEST
      DATABASE_URL: postgresql://knaba_test:synthetic-ci-only@127.0.0.1:5432/knaba_bridge_ci
      GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      KNABA_RELEASE_MODE: official
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - run: npm --prefix corporate-site ci --ignore-scripts --strict-ssl=true --no-audit --no-fund
      - run: npm --prefix erp ci --ignore-scripts --strict-ssl=true --no-audit --no-fund
      - run: node scripts/database-check.mjs
        working-directory: erp
      - run: npm --prefix corporate-site run build
      - run: npm --prefix erp run build
      - name: Run actual anonymous intake, signed HTTP and PostgreSQL acceptance
        # This isolated job requires PostgreSQL and both current build artifacts.
        # It never substitutes mocks or skipped SQL cases for the bridge gate.
        run: |
          erp/node_modules/.bin/tsx --tsconfig erp/tsconfig.json --test --test-concurrency=1 --test-reporter=tap tests/bridge/*.test.mjs | tee "$RUNNER_TEMP/bridge-tap.txt"
      - name: Reject skipped or incomplete bridge tests
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          const tap=readFileSync(`${process.env.RUNNER_TEMP}/bridge-tap.txt`,'utf8');
          const counts=Object.fromEntries([...tap.matchAll(/^# (tests|pass|fail|cancelled|skipped|todo) (\d+)$/gm)].map(match=>[match[1],Number(match[2])]));
          if(!(counts.tests>0) || counts.pass!==counts.tests || ['fail','cancelled','skipped','todo'].some(key=>counts[key]!==0)) {
            throw new Error('ALL_DISCOVERED_BRIDGE_TESTS_MUST_PASS_WITHOUT_SKIPS');
          }
          console.log('Passed bridge cases:',counts.pass,'source:',process.env.SOURCE_SHA);
          JS

  browser:
    name: Account HTTPS and lead-agent rendered UI
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      KNABA_RELEASE_MODE: official
      ASTRO_TELEMETRY_DISABLED: '1'
      APP_MODE: TEST
      COMPANY_ID: knaba-demo
      GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Require an already installed browser
        run: |
          browser_path="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$browser_path" ]; then
            echo 'BLOCKED: no installed authorized browser; downloads and sandbox bypass are forbidden.'
            exit 2
          fi
          echo "KNABA_CHROME_PATH=$browser_path" >> "$GITHUB_ENV"
          "$browser_path" --version
      - run: npm --prefix corporate-site ci --ignore-scripts --strict-ssl=true --no-audit --no-fund
      - run: npm --prefix erp ci --ignore-scripts --strict-ssl=true --no-audit --no-fund
      - run: npm --prefix corporate-site run build
      - run: npm --prefix erp run build
      - name: Real HTTPS forms, SQLite, six languages and fragment scripts
        env:
          KNABA_PLAYWRIGHT_MODULE: ${{ github.workspace }}/erp/node_modules/playwright
          KNABA_ACCOUNT_QA_DIR: ${{ runner.temp }}/knaba-account-browser
          KNABA_QA_SOURCE_SHA: ${{ env.SOURCE_SHA }}
        run: node corporate-site/tests/account-settings-browser.mjs
      - name: Render lead-agent UI with explicitly synthetic HTTP replies
        env:
          E2E_BASE_URL: http://127.0.0.1:4381
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ runner.temp }}/knaba-lead-ui.json
        run: |
          erp/node_modules/.bin/vite preview --config erp/apps/web/vite.config.ts --host 127.0.0.1 --port 4381 --strictPort > "$RUNNER_TEMP/knaba-lead-preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          export KNABA_PREVIEW_PID="$preview_pid"
          node --input-type=module <<'JS'
          let ready=false;
          for(let i=0;i<80;i++) {
            process.kill(Number(process.env.KNABA_PREVIEW_PID),0);
            try { if((await fetch(process.env.E2E_BASE_URL,{signal:AbortSignal.timeout(1000)})).status===200) {ready=true;break;} } catch {}
            await new Promise(resolve=>setTimeout(resolve,250));
          }
          if(!ready)throw Error('OWNED_LOOPBACK_PREVIEW_UNAVAILABLE');
          process.kill(Number(process.env.KNABA_PREVIEW_PID),0);
          JS
          export PLAYWRIGHT_CHROMIUM_EXECUTABLE="$KNABA_CHROME_PATH"
          cd erp
          npm run test:e2e -- tests/lead-agent-ui.spec.ts --reporter=line,json --output="$RUNNER_TEMP/knaba-lead-ui"
          kill -0 "$preview_pid"
      - name: Reject incomplete browser acceptance
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          const account=JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/knaba-account-browser/account-settings-browser-receipt.json`,'utf8'));
          const expected=['account.profile.persisted','account.validation.focus','account.sessions.revoke-others','account.password.rotate','account.mail.disabled','account.reset.fragment','account.reset.replay','account.email.confirm','account.layout.keyboard'];
          if(account.status!=='PASS'||account.sourceSha!==process.env.SOURCE_SHA||account.checks.length!==expected.length||expected.some(id=>account.checks.filter(c=>c.caseId===id&&c.status==='PASS').length!==1))throw Error('EXACT_ACCOUNT_BROWSER_ACCEPTANCE_REQUIRED');
          const lead=JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/knaba-lead-ui.json`,'utf8'));
          if(lead.stats.expected!==4||lead.stats.unexpected!==0||lead.stats.skipped!==0||lead.stats.flaky!==0||lead.errors.length!==0)throw Error('ALL_FOUR_LEAD_RENDERED_UI_CASES_MUST_PASS');
          console.log('Account HTTPS/SQLite browser cases: 9; lead rendered HTTP-fixture cases: 4; source:',process.env.SOURCE_SHA);
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: knaba-browser-${{ env.SOURCE_SHA }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/knaba-account-browser
            ${{ runner.temp }}/knaba-lead-ui.json
            ${{ runner.temp }}/knaba-lead-preview.log
            ${{ runner.temp }}/knaba-lead-ui
          if-no-files-found: error
          retention-days: 1

  failure-summary:
    name: Sanitized failure summary
    needs: [root, site, erp, bridge, browser]
    if: ${{ failure() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Write only source identity and job outcomes
        env:
          ROOT_RESULT: ${{ needs.root.result }}
          SITE_RESULT: ${{ needs.site.result }}
          ERP_RESULT: ${{ needs.erp.result }}
          BRIDGE_RESULT: ${{ needs.bridge.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re
          sha = os.environ['SOURCE_SHA']
          if not re.fullmatch(r'[0-9a-f]{40}', sha):
              raise SystemExit('INVALID_SOURCE_SHA')
          allowed = {'success', 'failure', 'cancelled', 'skipped'}
          results = {name: os.environ[key] for name, key in [('root', 'ROOT_RESULT'), ('site', 'SITE_RESULT'), ('erp', 'ERP_RESULT'), ('bridge', 'BRIDGE_RESULT'), ('browser', 'BROWSER_RESULT')]}
          if not all(value in allowed for value in results.values()):
              raise SystemExit('INVALID_JOB_RESULT')
          report = {'source_sha': sha, 'jobs': results, 'scope': 'CI only; no deployment or client-delivery acceptance'}
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'knaba-ci-failure.json'
          target.write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: knaba-ci-failure-${{ env.SOURCE_SHA }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/knaba-ci-failure.json
          if-no-files-found: error
          retention-days: 1
