name: KNABA repository verification

on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A push followed by its same-source draft PR needs one full verification.
  # The newest duplicate runs every gate against the same exact source SHA.
  group: knaba-ci-${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  CI: 'true'
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

defaults:
  run:
    shell: bash

jobs:
  root:
    name: Source integrity and policy tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - run: npm run audit:source
      - run: npm run verify:modules
      - run: npm test

  site:
    name: Corporate site checks and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: corporate-site
    env:
      KNABA_RELEASE_MODE: official
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - run: npm ci --ignore-scripts --strict-ssl=true --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run verify:build
      - run: npm run test:vps

  erp:
    name: ERP checks, build and PostgreSQL tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: erp
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_DB: knaba_ci
          POSTGRES_USER: knaba_test
          POSTGRES_PASSWORD: synthetic-ci-only
        ports:
          - '127.0.0.1:5432:5432'
        options: >-
          --health-cmd "pg_isready -U knaba_test -d knaba_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      APP_MODE: TEST
      COMPANY_ID: knaba-demo
      DATABASE_URL: postgresql://knaba_test:synthetic-ci-only@127.0.0.1:5432/knaba_ci
      GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --strict-ssl=true --no-audit --no-fund
      - name: Install independent document readers
        run: |
          python3 -m pip install --disable-pip-version-check openpyxl==3.1.5 Pillow==11.3.0
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils
          pdftotext -v
      - name: Build shared intake adapter for PostgreSQL regression tests
        # The four preserved adapter-level SQL cases use the same core as the
        # actual HTTP bridge job. No second dispatcher or site framework build.
        run: node_modules/.bin/esbuild ../corporate-site/vps/erp-intake-entry.ts --bundle --platform=node --target=node24 --format=esm --minify --outfile=../corporate-site/dist/vps/erp-intake.mjs
      - run: node scripts/database-check.mjs
      - run: npm run migrate
      - run: npm run typecheck
      - run: npm run build
      - name: Check built source identity
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const release=JSON.parse(readFileSync('dist/release.json','utf8'));
          const actual=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          if(actual!==process.env.SOURCE_SHA || release.code_sha!==actual || release.source_dirty!==false || release.source_provenance!=='GIT_WORKTREE') {
            throw new Error('EXACT_CLEAN_BUILD_SOURCE_REQUIRED');
          }
          console.log('Build source verified:',actual);
          JS
      - name: Run CPU and real PostgreSQL tests
        # Each SQL file reapplies DDL to the same database in beforeAll.
        # Serialize files; explicit concurrent transactions inside tests still run.
        run: npm test -- --no-file-parallelism --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/erp-vitest.json"
      - name: Reject skipped or incomplete ERP tests
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          const report=JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/erp-vitest.json`,'utf8'));
          if(report.success!==true || report.numTotalTests<1 || report.numPassedTests!==report.numTotalTests || report.numFailedTests!==0 || report.numPendingTests!==0 || report.numTodoTests!==0) {
            throw new Error('ALL_DISCOVERED_ERP_TESTS_MUST_PASS_WITHOUT_SKIPS');
          }
          const requiredFederationPostgres={
            'site-federation-ledger.integration.test.ts':12,
            'site-identity-link.integration.test.ts':12,
            'site-federation-login.integration.test.ts':18,
          };
          for(const [file,count] of Object.entries(requiredFederationPostgres)) {
            const suites=report.testResults?.filter(suite=>suite.name.endsWith('/tests/'+file));
            if(suites?.length!==1 || suites[0].assertionResults?.length!==count || suites[0].assertionResults.some(test=>test.status!=='passed')) {
              throw new Error('REQUIRED_FEDERATION_POSTGRESQL_INVENTORY_MISSING: '+file);
            }
          }
          console.log('Passed ERP assertions:',report.numPassedTests);
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: knaba-erp-tests-${{ env.SOURCE_SHA }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/erp-vitest.json
          if-no-files-found: warn
          retention-days: 1

  bridge:
    name: Site SQLite to ERP PostgreSQL HTTP acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_DB: knaba_bridge_ci
          POSTGRES_USER: knaba_test
          POSTGRES_PASSWORD: synthetic-ci-only
        ports:
          - '127.0.0.1:5432:5432'
        options: >-
          --health-cmd "pg_isready -U knaba_test -d knaba_bridge_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      APP_MODE: TEST
      DATABASE_URL: postgresql://knaba_test:synthetic-ci-only@127.0.0.1:5432/knaba_bridge_ci
      GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      KNABA_RELEASE_MODE: official
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - run: npm --prefix corporate-site ci --ignore-scripts --strict-ssl=true --no-audit --no-fund
      - run: npm --prefix erp ci --ignore-scripts --strict-ssl=true --no-audit --no-fund
      - name: Check browser runner guards without launching browsers
        run: node --test corporate-site/tests/ci-artifacts.test.mjs corporate-site/tests/ci-browser.test.mjs corporate-site/tests/browser-policy-gate.test.cjs
      - run: node scripts/database-check.mjs
        working-directory: erp
      - run: npm --prefix corporate-site run build
      - run: npm --prefix erp run build
      - name: Bind fresh site and ERP artifacts to the clean candidate
        env:
          KNABA_CI_ARTIFACT_MANIFEST: ${{ runner.temp }}/knaba-build-artifacts.json
        run: node corporate-site/tests/ci-artifacts.mjs
      - name: Run actual intake, federation, signed HTTP and PostgreSQL acceptance
        # This isolated job requires PostgreSQL and both current build artifacts.
        # It never substitutes mocks or skipped SQL cases for the bridge gate.
        run: |
          erp/node_modules/.bin/tsx --tsconfig erp/tsconfig.json --test --test-concurrency=1 --test-reporter=tap tests/bridge/*.test.mjs | tee "$RUNNER_TEMP/bridge-tap.txt"
      - name: Reject skipped or incomplete bridge tests
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          const tap=readFileSync(`${process.env.RUNNER_TEMP}/bridge-tap.txt`,'utf8');
          const counts=Object.fromEntries([...tap.matchAll(/^# (tests|pass|fail|cancelled|skipped|todo) (\d+)$/gm)].map(match=>[match[1],Number(match[2])]));
          if(!(counts.tests>0) || counts.pass!==counts.tests || ['fail','cancelled','skipped','todo'].some(key=>counts[key]!==0)) {
            throw new Error('ALL_DISCOVERED_BRIDGE_TESTS_MUST_PASS_WITHOUT_SKIPS');
          }
          const required=[
            'F2 real VPS/SQLite and built ERP/HTTP/PG require dual confirmation and preserve terminal unlink',
            'F2 actual source logout P→L→C rejects an already computed active proof before ERP binding commit',
            'F2 actual source credential P→L→C rejects an already computed active proof before ERP binding commit',
            'F2 lost actual FENCE ACK remains locally pending and retries one durable intent with a fresh nonce',
            'F2 delayed first REGISTER cannot escape an actual unknown-session tombstone after source recovery',
            'F2 a pre-enrollment SQLite restore reconciles the external authority and cannot revive an old source session',
            'F2 two actual companies cannot consume each other’s code even with equal immutable source IDs and signing keys',
          ];
          const passed=[...tap.matchAll(/^ok \d+ - (F2 [^\n]+)$/gm)].map(match=>match[1]);
          if(passed.length!==required.length || required.some(name=>passed.filter(value=>value===name).length!==1)) {
            throw new Error('ALL_SEVEN_F2_RUNTIME_PAIR_CASES_REQUIRED');
          }
          const requiredLogin=[
            'F3 actual WEB login retains current ERP roles and requires a mandatory source session lineage',
            'F3 actual native PKCE code rejects a wrong verifier and permits exactly one concurrent redemption',
            'F3 actual lost approval ACK recovers one durable intent before any ERP session is issued',
            'F3 actual source logout rejects an already computed issue proof before the ERP session commit',
            'F3 actual source outage fails closed while local logout completes without source RPC',
            'F3 actual self-device mint needs local ERP credentials and terminal unlink revokes the derived session',
            'F3 actual source restart fences old derived sessions while a local ERP password session remains valid',
            'F3 actual two-company native code cannot be redeemed by the other configured authority',
          ];
          const passedLogin=[...tap.matchAll(/^ok \d+ - (F3 [^\n]+)$/gm)].map(match=>match[1]);
          if(passedLogin.length!==requiredLogin.length || requiredLogin.some(name=>passedLogin.filter(value=>value===name).length!==1)) {
            throw new Error('ALL_EIGHT_F3_RUNTIME_PAIR_CASES_REQUIRED');
          }
          console.log('Passed bridge cases:',counts.pass,'source:',process.env.SOURCE_SHA);
          JS
      - name: Actual installed-browser role and responsive acceptance
        # Reuse the runner's installed Chrome and the ERP's pinned Playwright
        # library. No browser download, sandbox bypass, live login or deployment.
        env:
          KNABA_BROWSER_QA_DIR: ${{ runner.temp }}/knaba-browser
          KNABA_CI_ARTIFACT_MANIFEST: ${{ runner.temp }}/knaba-build-artifacts.json
        run: node corporate-site/tests/ci-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: knaba-browser-${{ env.SOURCE_SHA }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/knaba-browser
            ${{ runner.temp }}/knaba-build-artifacts.json
            ${{ runner.temp }}/bridge-tap.txt
          if-no-files-found: warn
          retention-days: 1

  failure-summary:
    name: Sanitized failure summary
    needs: [root, site, erp, bridge]
    if: ${{ failure() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Write only source identity and job outcomes
        env:
          ROOT_RESULT: ${{ needs.root.result }}
          SITE_RESULT: ${{ needs.site.result }}
          ERP_RESULT: ${{ needs.erp.result }}
          BRIDGE_RESULT: ${{ needs.bridge.result }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re
          sha = os.environ['SOURCE_SHA']
          if not re.fullmatch(r'[0-9a-f]{40}', sha):
              raise SystemExit('INVALID_SOURCE_SHA')
          allowed = {'success', 'failure', 'cancelled', 'skipped'}
          results = {name: os.environ[key] for name, key in [('root', 'ROOT_RESULT'), ('site', 'SITE_RESULT'), ('erp', 'ERP_RESULT'), ('bridge', 'BRIDGE_RESULT')]}
          if not all(value in allowed for value in results.values()):
              raise SystemExit('INVALID_JOB_RESULT')
          report = {'source_sha': sha, 'jobs': results, 'scope': 'CI only; no deployment or client-delivery acceptance'}
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'knaba-ci-failure.json'
          target.write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: knaba-ci-failure-${{ env.SOURCE_SHA }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/knaba-ci-failure.json
          if-no-files-found: error
          retention-days: 1
