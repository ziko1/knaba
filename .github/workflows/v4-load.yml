name: KNABA V4 isolated core load measurement
on:
  push:
    branches: [knaba-staging]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'infra/**'
      - 'scripts/v4-load*'
      - '.github/workflows/v4-load.yml'
      - 'package*.json'
      - 'tsconfig.json'
permissions:
  contents: read
concurrency:
  group: knaba-v4-load-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core-load:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_DB: knaba_v4_load
          POSTGRES_USER: knaba_load_test
          POSTGRES_PASSWORD: synthetic-load-ci-only
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd "pg_isready -U knaba_load_test -d knaba_v4_load"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      APP_MODE: TEST
      COMPANY_ID: knaba-v4-load-synthetic-fixture
      KNABA_LOAD_COMPANY_ID: knaba-v4-load-synthetic-fixture
      DATABASE_URL: postgresql://knaba_load_test:synthetic-load-ci-only@127.0.0.1:5432/knaba_v4_load
      GIT_SHA: ${{ github.sha }}
      EXPECTED_GIT_SHA: ${{ github.sha }}
      KNABA_LOAD_ACK: SYNTHETIC_ISOLATED_DATABASE
      KNABA_LOAD_BASE_URL: http://127.0.0.1:3000
      KNABA_LOAD_ALLOWED_ORIGINS: http://127.0.0.1:3000
      PUBLIC_ORIGIN: http://127.0.0.1:3000
      PORT: '3000'
      LIVE_SEND_ALLOWED: 'false'
      LIVE_INTEGRATION_SEND_ALLOWED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci --ignore-scripts --strict-ssl=true
      - run: npm run build
      - run: npm run migrate
      - name: Measure real HTTP sessions and acknowledged command conservation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_GIT_SHA"
          test -z "$(git status --porcelain --untracked-files=normal)"
          unset WHATSAPP_ACCESS_TOKEN WHATSAPP_APP_SECRET DEEPSEEK_API_KEY INTEGRATION_CREDENTIALS_JSON
          mkdir -p .local
          node dist/server.mjs > .local/v4-load-api.log 2>&1 &
          KNABA_LOAD_API_PID=$!
          trap 'kill "$KNABA_LOAD_API_PID" 2>/dev/null || true' EXIT
          KNABA_LOAD_STARTED=false
          for attempt in $(seq 1 60); do
            if curl --silent --fail --max-time 2 http://127.0.0.1:3000/health > /dev/null; then
              KNABA_LOAD_STARTED=true
              break
            fi
            if ! kill -0 "$KNABA_LOAD_API_PID" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$KNABA_LOAD_STARTED" != true ]; then
            node --input-type=module -e 'import{writeFileSync}from"node:fs";writeFileSync(".local/v4-load-result.json",JSON.stringify({status:"FAILED",sourceSha:process.env.EXPECTED_GIT_SHA,core:{status:"NOT_RUN"},reason:"ISOLATED_API_DID_NOT_START",wholeAc67:"NOT_RUN_FULL_CRITERION"},null,2)+"\n");'
            exit 1
          fi
          timeout --signal=TERM --kill-after=30s 1320s node --import tsx scripts/v4-load.mts --run --profile full --output .local/v4-load-result.json
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          const value=JSON.parse(readFileSync('.local/v4-load-result.json','utf8'));
          if(value.sourceSha!==process.env.EXPECTED_GIT_SHA||value.core?.status!=='PASSED'||value.exactReplay?.status!=='PASSED'||value.status!=='PARTIAL_MEASURED_CORE_ONLY')throw Error('CORE_LOAD_MEASUREMENT_NOT_ACCEPTED');
          console.log(JSON.stringify({sourceSha:value.sourceSha,status:value.status,core:value.core,wholeAc67:value.wholeAc67}));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: knaba-v4-core-load-${{ github.sha }}
          path: .local/v4-load-result.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
