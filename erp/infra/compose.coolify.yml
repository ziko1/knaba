# KNABA DE synthetic VPS test. Deploy through Coolify; no public database/API host ports.
# Build exact GIT_SHA locally before deployment. Required gate is managed in proxy dynamic config.
x-runtime: &id001
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL with the postgres service hostname}
  APP_MODE: ${APP_MODE:-DEMO}
  COMPANY_ID: ${COMPANY_ID:-knaba-demo}
  AUTH_ENCRYPTION_KEY: ${AUTH_ENCRYPTION_KEY:?Set a private random AUTH_ENCRYPTION_KEY
    of at least 32 characters}
  GIT_SHA: ${GIT_SHA:?Set the exact tested 40-character Git SHA}
  PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3000}
  PORT: '3000'
  NODE_ENV: production
  WIDGET_ALLOWED_ORIGINS: ${WIDGET_ALLOWED_ORIGINS:-}
  MEDIA_SCANNER_URL: ${MEDIA_SCANNER_URL:-}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
  S3_KMS_KEY_ID: ${S3_KMS_KEY_ID:-}
  AWS_REGION: ${AWS_REGION:-eu-central-1}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
  WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
  WHATSAPP_PUBLIC_NUMBER: ${WHATSAPP_PUBLIC_NUMBER:-}
  WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
  WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
  WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
  WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-}
  WHATSAPP_ACCOUNT_CAPABILITIES_VERIFIED: ${WHATSAPP_ACCOUNT_CAPABILITIES_VERIFIED:-false}
  WHATSAPP_TEST_RECIPIENTS: ${WHATSAPP_TEST_RECIPIENTS:-}
  LIVE_SEND_ALLOWED: ${LIVE_SEND_ALLOWED:-false}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
  DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-}
  DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
  DEEPSEEK_REGION: ${DEEPSEEK_REGION:-}
  AI_TRANSFER_APPROVAL_ID: ${AI_TRANSFER_APPROVAL_ID:-}
  AI_SYNTHETIC_ONLY: ${AI_SYNTHETIC_ONLY:-true}
  AI_INPUT_PRICE_PER_MILLION_CENTS: ${AI_INPUT_PRICE_PER_MILLION_CENTS:-100}
  AI_OUTPUT_PRICE_PER_MILLION_CENTS: ${AI_OUTPUT_PRICE_PER_MILLION_CENTS:-200}
services:
  bootstrap:
    image: knaba-de-api:${GIT_SHA:?Set exact Git SHA}
    restart: 'no'
    healthcheck:
      disable: true
    depends_on:
      knaba-postgres:
        condition: service_healthy
    environment: *id001
    command:
    - sh
    - -ec
    - "node scripts/environment-check.mjs\nnpm run migrate\ncase \"$$APP_MODE\" in\n\
      \  DEMO|TEST) npm run seed ;;\n  PRODUCTION) echo 'NOT_RUN: production synthetic\
      \ seed is forbidden; provision the verified company/owner through the protected\
      \ offline bootstrap.' ;;\n  *) exit 1 ;;\nesac\n"
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    mem_limit: 384m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    pull_policy: never
  api:
    image: knaba-de-api:${GIT_SHA:?Set exact Git SHA}
    restart: unless-stopped
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      knaba-postgres:
        condition: service_healthy
    environment: *id001
    command:
    - node
    - dist/server.mjs
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    mem_limit: 384m
    cpus: 0.5
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    pull_policy: never
    expose:
    - '3000'
    labels:
    - coolify.traefik.middlewares=knaba-test-access@file
  worker:
    image: knaba-de-api:${GIT_SHA:?Set exact Git SHA}
    command:
    - node
    - dist/worker.mjs
    restart: unless-stopped
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL with the postgres service hostname}
      APP_MODE: ${APP_MODE:-DEMO}
      COMPANY_ID: ${COMPANY_ID:-knaba-demo}
      AUTH_ENCRYPTION_KEY: ${AUTH_ENCRYPTION_KEY:?Set a private random AUTH_ENCRYPTION_KEY
        of at least 32 characters}
      GIT_SHA: ${GIT_SHA:?Set the exact tested 40-character Git SHA}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3000}
      PORT: '3000'
      NODE_ENV: production
      WIDGET_ALLOWED_ORIGINS: ${WIDGET_ALLOWED_ORIGINS:-}
      MEDIA_SCANNER_URL: ${MEDIA_SCANNER_URL:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      S3_KMS_KEY_ID: ${S3_KMS_KEY_ID:-}
      AWS_REGION: ${AWS_REGION:-eu-central-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_PUBLIC_NUMBER: ${WHATSAPP_PUBLIC_NUMBER:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-}
      WHATSAPP_ACCOUNT_CAPABILITIES_VERIFIED: ${WHATSAPP_ACCOUNT_CAPABILITIES_VERIFIED:-false}
      WHATSAPP_TEST_RECIPIENTS: ${WHATSAPP_TEST_RECIPIENTS:-}
      LIVE_SEND_ALLOWED: ${LIVE_SEND_ALLOWED:-false}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      DEEPSEEK_REGION: ${DEEPSEEK_REGION:-}
      AI_TRANSFER_APPROVAL_ID: ${AI_TRANSFER_APPROVAL_ID:-}
      AI_SYNTHETIC_ONLY: ${AI_SYNTHETIC_ONLY:-true}
      AI_INPUT_PRICE_PER_MILLION_CENTS: ${AI_INPUT_PRICE_PER_MILLION_CENTS:-100}
      AI_OUTPUT_PRICE_PER_MILLION_CENTS: ${AI_OUTPUT_PRICE_PER_MILLION_CENTS:-200}
      WORKER_HEARTBEAT_FILE: /tmp/knaba-worker-heartbeat
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - const fs=require('node:fs');const file=process.env.WORKER_HEARTBEAT_FILE||'/tmp/knaba-worker-heartbeat';try{if(Date.now()-fs.statSync(file).mtimeMs>30000)process.exit(1);}catch{process.exit(1);}
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    mem_limit: 256m
    cpus: 0.25
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    pull_policy: never
  backup:
    image: knaba-de-backup:${GIT_SHA:?Set exact Git SHA}
    pull_policy: never
    restart: unless-stopped
    entrypoint: ["sleep", "infinity"]
    depends_on:
      knaba-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL with the postgres service hostname}
      GIT_SHA: ${GIT_SHA:?Set the exact tested 40-character Git SHA}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:?Set a separate random backup passphrase}
      BACKUP_DIR: /backups
      KNABA_PG_TRANSPORT: native
    volumes:
    - backups_data:/backups
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    mem_limit: 256m
    cpus: 0.25
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  knaba-postgres:
    image: postgres:17.11-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-knaba}
      POSTGRES_USER: ${POSTGRES_USER:-knaba}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the private
        environment file}
    volumes:
    - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 12
    mem_limit: 256m
    cpus: 0.25
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
volumes:
  postgres_data: null
  backups_data: null
