name: KNABADE
options:
  bundleIdPrefix: de.knaba
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.5.0"
    CURRENT_PROJECT_VERSION: "8"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG KNABA_FEDERATION_TEST"
targets:
  KNABADE:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
      - path: PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.knaba.mobile
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Debug:
          INFOPLIST_FILE: Info.Debug.plist
        Release:
          INFOPLIST_FILE: Info.plist
    dependencies:
      - sdk: CoreLocation.framework
      - sdk: Security.framework
      - sdk: CryptoKit.framework
      - sdk: AuthenticationServices.framework
  KNABADETests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: ../../tests/native-vectors.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.knaba.mobile.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: KNABADE
schemes:
  KNABADE:
    build:
      targets:
        KNABADE: all
    test:
      targets:
        - KNABADETests
      gatherCoverageData: true
    archive:
      config: Release
